# ── GravitationalWave v4.15: Shared location blocks ──
# Included by both HTTP (80) and HTTPS (443) server blocks.
# Single source of truth — edit here, both servers update.
# NOTE: HTTPS server block must include hsts.conf; HTTP must NOT.

# ── INDEX.HTML: never cached (always fetch latest SPA shell) ──
location = /index.html {
    root   /usr/share/nginx/html;
    include /etc/nginx/includes/security-headers.conf;
    include /etc/nginx/includes/csp-header.conf;
    # HTTPS server adds hsts.conf above; HTTP block omits it.
    # The include will fail silently on HTTP, which is correct.
    include /etc/nginx/includes/hsts.conf;
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
}

# ── HASHED ASSETS: 1 year immutable cache (fingerprinted by Vite) ──
location ~* ^/assets/.+\.(js|css|woff2?|ttf|otf)$ {
    root /usr/share/nginx/html;
    include /etc/nginx/includes/security-headers.conf;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable, stale-while-revalidate=86400" always;
    try_files $uri =404;
}

# ── STATIC IMAGES: 30 day cache (rarely-changing, non-fingerprinted) ──
location ~* \.(png|jpg|jpeg|gif|svg|ico|webp)$ {
    root /usr/share/nginx/html;
    include /etc/nginx/includes/security-headers.conf;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=604800" always;
    try_files $uri =404;
}

# ── SPA FALLBACK ──
location / {
    root   /usr/share/nginx/html;
    include /etc/nginx/includes/security-headers.conf;
    include /etc/nginx/includes/csp-header.conf;
    try_files $uri $uri/ /index.html;
    index  index.html index.htm;
}

# ── API PROXY (Spring Boot backend) ──
location ^~ /api/ {
    proxy_pass http://gw-backend:8093/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    include /etc/nginx/includes/security-headers.conf;
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS' always;
    add_header Access-Control-Allow-Headers 'Authorization, Content-Type' always;
}

# ── STATIC FILES PROXY (FITS images, thumbnails) ──
# v4.15: 30-day cache — FITS data is static astronomical survey data.
# Stale-while-revalidate allows instant stale delivery while re-fetching in background.
location ^~ /static-files/ {
    proxy_pass http://gw-backend:8093/static-files/;
    proxy_set_header Host $host;
    include /etc/nginx/includes/security-headers.conf;
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS' always;
    add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=604800" always;
    proxy_cache_valid 200 720h;
    proxy_cache_valid 304 720h;
    proxy_cache_key "$scheme$request_method$host$request_uri";
    proxy_buffering on;
    proxy_buffer_size 16k;
    proxy_buffers 8 64k;
    proxy_busy_buffers_size 128k;
}

# ── PIPELINE PROXY (Python FastAPI) ──
location ^~ /pipeline/ {
    proxy_pass http://gw-pipeline:8200/pipeline/;
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;
    include /etc/nginx/includes/security-headers.conf;
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
}

# ── FIREFLY PROXY (IPAC Firefly FITS viewer) ──
location ^~ /firefly/ {
    proxy_pass http://gw-firefly:8080/firefly/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    include /etc/nginx/includes/security-headers.conf;
}

# ── WEBASSEMBLY ──
location ~* \.wasm$ {
    types { } default_type application/wasm;
}
