# GravitationalWave Platform — Docker Logrotate Config (v4.15)
# Install (Linux): sudo cp gw-logrotate.conf /etc/logrotate.d/gw-docker
# Install (macOS): sudo cp gw-logrotate.conf /usr/local/etc/logrotate.d/gw-docker
#
# Requires logrotate to be installed:
#   apt-get install logrotate    (Debian/Ubuntu)
#   brew install logrotate       (macOS)
#   pacman -S logrotate          (MSYS2/Windows)

# Docker container logs (json-file driver)
# Path varies by OS — adjust to your Docker root
/var/lib/docker/containers/*/*.log
{
    daily
    rotate 14
    size 10M
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    dateext
    dateformat -%Y%m%d
    maxage 30
    postrotate
        # Reload is handled by copytruncate, no signal needed
        echo "[$(date)] Log rotated: $LOG" >> /var/log/gw-logrotate.log
    endscript
}
