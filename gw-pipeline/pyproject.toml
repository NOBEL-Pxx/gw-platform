[project]
name = "gw-pipeline"
version = "0.1.0"
description = "Gravitational Wave Astropy FITS Processing Pipeline"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "astropy>=6.0.0",
    "scikit-image>=0.22.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
