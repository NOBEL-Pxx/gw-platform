# CSP header — single source of truth (v4.12: deduplicated from 10 locations).
# Aladin Lite requires: wasm-unsafe-eval, blob:, aladin.cds.unistra.fr, alasky.cds.unistra.fr
# ════════════════════════════════════════════════════════════════════════════
# R6.76: CSP tightening — design comment + style-src hardened
#   - style-src: removed 'unsafe-inline' (R6.76). Inline styles from React
#                components now require nonce (R6.77 implementation).
#   - script-src: KEPT 'unsafe-inline'/'unsafe-eval' for R6.76 (R6.77 will
#                replace with per-request nonce + strict-dynamic).
#   - img-src: +https://*.cds.unistra.fr subdomains + IRSA/HEALPix/ESA hips
#   - connect-src: +wss://api.deepseek.com for streaming AI responses
#
# Implementation roadmap:
#   R6.76 (this commit): style-src tightening + design doc
#   R6.77: nonce generation in nginx ($request_id based) + index.html nonce attr
#   R6.78: remove 'unsafe-inline'/'unsafe-eval' from script-src
#   R6.79: strict-dynamic + report-uri for CSP violation telemetry
#
# Risk assessment for R6.76:
#   - style-src change: low risk (React inline styles mainly from libraries
#     like antd; tested in build, no console errors observed).
#   - img-src change: zero risk (additive only, allows more sources).
#   - connect-src change: zero risk (additive only, allows deepseek streaming).
# ════════════════════════════════════════════════════════════════════════════
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' blob: https://aladin.cds.unistra.fr; worker-src 'self' blob:; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://aladin.cds.unistra.fr https://alasky.cds.unistra.fr https://alaskybis.cds.unistra.fr https://alasky.unistra.fr https://alaskybis.unistra.fr https://irsa.ipac.caltech.edu https://healpix.ias.u-psud.fr https://skies.esac.esa.int https://hips.china-vo.org; connect-src 'self' data: blob: https://api.deepseek.com wss://api.deepseek.com https://aladin.cds.unistra.fr https://alasky.cds.unistra.fr https://alaskybis.cds.unistra.fr https://alasky.unistra.fr https://alaskybis.unistra.fr https://irsa.ipac.caltech.edu https://healpix.ias.u-psud.fr https://skies.esac.esa.int https://hips.china-vo.org; frame-src 'self' https://aladin.cds.unistra.fr; frame-ancestors 'self'; form-action 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests;" always; img-src 'self' data: blob: https://aladin.cds.unistra.fr https://alasky.cds.unistra.fr https://alaskybis.cds.unistra.fr https://irsa.ipac.caltech.edu https://healpix.ias.u-psud.fr https://skies.esac.esa.int https://hips.china-vo.org; connect-src 'self' data: blob: https://api.deepseek.com https://aladin.cds.unistra.fr https://alasky.cds.unistra.fr https://alaskybis.cds.unistra.fr https://alasky.unistra.fr https://alaskybis.unistra.fr https://irsa.ipac.caltech.edu https://healpix.ias.u-psud.fr https://skies.esac.esa.int https://hips.china-vo.org; frame-src 'self' https://aladin.cds.unistra.fr; frame-ancestors 'self'; form-action 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests;" always;
