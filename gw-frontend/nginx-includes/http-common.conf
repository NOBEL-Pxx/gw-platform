# ── GravitationalWave v4.15: HTTP-level shared settings ──
# Auto-included by nginx at http level (in /etc/nginx/includes/).
# NOTE: sendfile, tcp_nopush, tcp_nodelay, server_tokens are already set
# in nginx base config — only add settings NOT in the default.

include /etc/nginx/mime.types;

gzip_static on;
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1000;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    application/x-javascript
    image/svg+xml
    font/ttf
    font/otf;

# FITS MIME type (not in default mime.types)
types {
    application/fits  fits;
}
