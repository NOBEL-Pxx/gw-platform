user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
# R6.65: pid in /var/cache/nginx because that path is chown'd nginx:nginx by
# Dockerfile. /var/run/ under docker compose v2.19.x is a root:root 755 tmpfs
# even with :mode=1777 (legacy Tmpfs API silently drops the mode) - nginx user
# (uid 101) cannot write there, causing master to exit before binding port 80.
pid        /var/cache/nginx/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    # v4.55: http-level shared settings (gzip, FITS mime type) relocated here
    # because /etc/nginx/conf.d/ is now a tmpfs for runtime envsubst output.
    include /etc/nginx/includes/http-common.conf;

    include /etc/nginx/conf.d/*.conf;
}
