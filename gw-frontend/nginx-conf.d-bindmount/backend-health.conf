# R6.96 backend healthcheck endpoint
# Lives in bindmount/ (loaded BEFORE image-baked conf.d/*.conf in nginx.conf).
# Same pattern as r692-smoketest.conf (R6.95).
#
# Endpoint: GET /backend-health -> 200 with OpenAPI JSON from gw-backend
# Access via custom Host header:
#   curl -sk --resolve "backend-health.local:6002:127.0.0.1" \
#        https://backend-health.local:6002/backend-health
#
# Why: gw-backend is Spring Boot on port 8093 (container name: divs-backend,
# service DNS name: gw-backend). Direct access requires docker exec or
# VPN-bypass tunnel. This endpoint makes backend health observable from nginx
# (port 443) without VPN or docker exec.
#
# R6.96c: Changed upstream from /actuator/health to /v3/api-docs because gw-backend
# does NOT enable Spring Boot Actuator (spring-boot-starter-actuator not in build).
#   /actuator/health -> 500 "NoResourceFoundException: No static resource actuator/health"
#   /v3/api-docs    -> 200 + 17KB OpenAPI JSON (proves Spring alive + controllers loaded)
# Trade-off: response body is OpenAPI spec instead of {"status":"UP"}. Use X-Backend-Status
# header (added below) for the actual health verdict -- 200 = up, 500 = down.
# R6.97 backlog: add spring-boot-starter-actuator to gw-backend pom.xml so /actuator/health
# returns proper {"status":"UP"}. Then revert upstream here.
#
# Deployment: same as r692-smoketest.conf -- pure static, no envsubst.
# Lives in nginx-conf.d-bindmount/, picked up by `include ...bindmount/*.conf`
# BEFORE conf.d/*.conf.
server {
    listen 443 ssl http2;
    server_name backend-health.local;  # unique name so default.conf still handles main app

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # R6.96: backend healthcheck proxy (via Spring Boot OpenAPI canary)
    # Docker service name 'gw-backend' resolves to divs-backend container on gw-net.
    # /v3/api-docs returns 200 only when Spring Boot is alive AND controllers are loaded.
    location = /backend-health {
        # R6.96c: /actuator/health not available (no spring-boot-starter-actuator).
        # /v3/api-docs is a stable canary: 200 = backend healthy, 500 = backend unhealthy.
        proxy_pass http://gw-backend:8093/v3/api-docs;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Short timeout -- healthcheck should respond in <1s
        proxy_connect_timeout 2s;
        proxy_read_timeout    2s;
        proxy_send_timeout    2s;

        # Pass through JSON as-is (don't try to parse)
        proxy_pass_request_headers on;
        proxy_pass_request_body    on;

        # Show upstream status when proxying -- this IS the health verdict
        add_header X-Backend-Status  $upstream_status always;
        add_header X-Backend-Address $upstream_addr   always;
        add_header X-Health-Check   "R6.96c-v3-api-docs-canary" always;
    }
}
