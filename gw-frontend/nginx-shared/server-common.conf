# ── GravitationalWave v4.15: Server-level shared settings ──
# Included manually by server blocks via /etc/nginx/shared/.
# Single source of truth — edit here, both HTTP/HTTPS servers update.

keepalive_timeout 65;
keepalive_requests 100;
client_max_body_size 50m;

# Strip crossorigin attr from module scripts (fixes Windows proxy module-loading bug)
sub_filter 'type="module" crossorigin' 'type="module"';
sub_filter_once on;
sub_filter_types text/html;
