# ═══════════════════════════════════════════════════════════════════════════
# GravitationalWave Platform — Nginx Config (v4.15)
# Refactored: shared config in include files — zero duplication.
# http-common.conf  → auto-included at http level (gzip, mime, sendfile)
# server-common.conf → included per server block (keepalive, sub_filter)
# locations-common.conf → included per server block (all location blocks)
# security-headers.conf / csp-header.conf → included per server block
# ═══════════════════════════════════════════════════════════════════════════

# R6.72 #1: CORS origin validation tightened.
# Before (v4.7-R6.71): wildcard `~^https?://.*$` matched any HTTP/HTTPS,
#         fell back to NGINX_CORS_DOMAIN env. Compose default was empty
#         (= no CORS effectively), but the regex was a footgun: a future
#         NGINX_CORS_DOMAIN=https://*.example.com would silently allow all
#         subdomains.
# After: explicit comma-separated whitelist via NGINX_CORS_ALLOWED_ORIGINS.
#         Set in compose env: NGINX_CORS_ALLOWED_ORIGINS=https://app.example.com,https://admin.example.com
#         Empty default = CORS locked down (dev: only localhost allowed).
#         NGINX_CORS_DOMAIN kept for single-origin backward compat (no regex).
#
# Implementation: nginx `map` is first-match-wins. Each line is a regex;
#                 empty `default` means no Access-Control-Allow-Origin header.
map   {
    default "";
    "~^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$" "";
    # R6.72: explicit list via NGINX_CORS_ALLOWED_ORIGINS (comma-separated, no spaces)
    "~^()$" "";
    # R6.72 legacy: single NGINX_CORS_DOMAIN (exact match, no wildcards)
    "~^$" "";
}

# ═══════════════════════════════════════════════════════════════════════════
#  HTTPS SERVER (port 443 → mapped to 6002)
# ═══════════════════════════════════════════════════════════════════════════
server {
    # R6.99-E: default_server + IPv6 + production server_name.
    # 6002 IP-direct (Host: 10.107.207.103) needs `default_server` because
    # `server_name _` matches Host headers but not bare IP per [[r698-nginx-default-server-iron-rule]].
    # `alicpt.lhr.life` is the canonical prod domain; `_` is catch-all for unknown hosts.
    listen       443 ssl http2 default_server;
    listen  [::]:443 ssl http2 default_server;
    server_name  alicpt.lhr.life _ localhost;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    include /etc/nginx/shared/server-common.conf;
    include /etc/nginx/includes/hsts.conf;
    include /etc/nginx/includes/security-headers.conf;
    include /etc/nginx/includes/csp-header.conf;
    include /etc/nginx/shared/locations-common.conf;

    # R6.99-F: /v3/ (Spring Boot OpenAPI spec path) proxy to divs-backend.
    # Without this handler, /v3/api-docs falls through to location / SPA fallback
    # in locations-common.conf and serves index.html (9195B) instead of the
    # OpenAPI JSON spec (17820B). Discovered 2026-09-14 during 6002 slowness
    # diagnostic: 5 hits in nginx access log all returned SPA shell to real users.
    # location / (length 1) loses to ^~ /v3/ (length 4) on longest-prefix match,
    # so this overrides the SPA fallback without touching image-baked locations.
    location ^~ /v3/ {
        proxy_pass http://divs-backend:8093/v3/;
        proxy_http_version 1.1;
        proxy_set_header Host              ;
        proxy_set_header X-Real-IP         ;
        proxy_set_header X-Forwarded-For   ;
        proxy_set_header X-Forwarded-Proto ;
        proxy_read_timeout 60s;
        include /etc/nginx/includes/security-headers.conf;
        include /etc/nginx/includes/csp-header.conf;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html { root /usr/share/nginx/html; }
}

# ═══════════════════════════════════════════════════════════════════════════
#  HTTP SERVER (port 80 → mapped to 6001)
#  TLS handled externally by tunnel / reverse proxy. No HSTS.
# ═══════════════════════════════════════════════════════════════════════════
server {
    listen       80;
    server_name  localhost;

    # R6.37: server-level HTTP -> HTTPS redirect.
    # Lab VPN blocks fonts.googleapis.com for HTTP pages (caused R6.35b/R6.36).
    # Always redirect to HTTPS 6002 which isn't filtered.  preserves
    # the user's hostname (e.g. 10.107.207.103).
    return 301 https://:6002;
}
