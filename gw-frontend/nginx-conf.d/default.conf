# R6.98-fix: Add listen 443 + production server_name
# Background: gw-frontend bind-mounts ./gw-frontend/nginx-conf.d/ to /etc/nginx/conf.d/
# on zjlab (R6.89b). docker-compose exposes 6001:80 + 6002:443.
# Pre-fix: default.conf only listened 80 → 6002 + IP-host hit no server block → 404
# Post-fix: default.conf listens both 80 + 443 → IP-host + alicpt.lhr.life both hit frontend static files.
# Cert path /etc/nginx/ssl/ is baked into image (Dockerfile COPY ssl/ /etc/nginx/ssl/)
# and not bind-mounted, so path is stable.
#
# server_name ordering:
#   1. alicpt.lhr.life        — production domain (canonical)
#   2. _ (catch-all)            — IP 直连 + 任意 Host 头
#   3. localhost                — 健康检查 / debug
# runtime/*.conf (backend-health.local, r692-smoketest.local) take precedence
# via nginx.conf include order (runtime/*.conf loaded BEFORE conf.d/*.conf).
#
# SCOPE OF FIX (MINIMAL):
#   - Add listen 443 ssl http2 lines
#   - Add server_name catch-all
#   - Add SPA try_files fallback (so client routing works without 404)
#   - Add /api/ proxy_pass to gw-backend:8093 (was missing — /api/health wouldn't reach backend)
#   - DO NOT change root, error pages, 50x.html, or any other directive.

server {
    # R6.98-fix v2: 80 default_server — ONLY if r692-smoketest.conf does NOT have it.
    # Currently r692-smoketest.conf has `listen 80 default_server` (R6.94), so we skip it.
    # If r692-smoketest.conf is removed/renamed in future, uncomment these:
    # listen       80 default_server;
    # listen  [::]:80 default_server;
    listen       80;
    listen  [::]:80;
    # 443 default_server — needed for IP 直连 6002 + 任意 Host 头
    # (server_name `_` matches any hostname but NOT bare IP)
    listen       443 ssl http2 default_server;
    listen  [::]:443 ssl http2 default_server;
    server_name  alicpt.lhr.life _ localhost;

    # SSL cert (same source as runtime/*.conf — image-baked /etc/nginx/ssl/)
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Optional: HTTP -> HTTPS redirect for production domain (alicpt.lhr.life)
    # But we don't force-redirect here because:
    #   - 6001:80 in compose expects HTTP traffic (60/30/10 dev workflow)
    #   - browser/IP users hitting 6002 already HTTPS
    # If you want strict redirect, uncomment below:
    # if ($scheme = http) {
    #     return 301 https://$host$request_uri;
    # }

    #charset koi8-r;
    #access_log  /var/log/nginx/host.access.log  main;

    # R6.98-fix: combined root + SPA fallback in ONE location block
    # try_files $uri $uri/ /index.html serves:
    #   1. Static file if exists
    #   2. Directory index if exists
    #   3. /index.html (SPA client-side routing fallback)
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # R6.98-fix: Backend API proxy — frontend /api/* → gw-backend:8093
    # Pre-fix: no proxy_pass in default.conf → /api/health would 404 even if nginx listens 443
    # Post-fix: matches R6.96c gw-backend OpenAPI canary upstream + general /api routing
    location /api/ {
        proxy_pass http://gw-backend:8093;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
    }

    #error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    # deny access to .htaccess files, if Apache's document root
    # concurs with nginx's one
    #location ~ /\\.ht {
    #    deny  all;
    #}
}
