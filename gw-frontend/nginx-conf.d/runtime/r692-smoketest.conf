# R6.95 smoketest endpoint
# Lives in runtime/ (loaded BEFORE image-baked conf.d/*.conf in nginx.conf).
# Migration history:
#   R6.92b/R6.94: 0r692-smoketest.conf.template in conf.d/templates/ (envsubst path)
#   - Required 0-prefix filename hack so entrypoint output loaded before default.conf
#   - Required unique server_name (r692-smoketest.local) to avoid shadowing default.conf
#   R6.95: r692-smoketest.conf in conf.d/runtime/ (static path; R6.100 renamed from bindmount/)
#   - Drop 0-prefix (explicit include ordering now handles precedence)
#   - Drop envsubst (this dir is static *.conf, not generated from *.template)
#   - Same unique server_name preserved
#
# Endpoint: GET /r692-smoketest-status -> 200 with HOSTNAME marker
# Access via custom Host header so smoketest doesn't shadow default.conf:
#   curl -sk --resolve "r692-smoketest.local:6002:127.0.0.1" \
#        https://r692-smoketest.local:6002/r692-smoketest-status
# Or via 6001 with -H:
#   curl -skL -H "Host: r692-smoketest.local" http://localhost:6001/r692-smoketest-status
server {
    listen 443 ssl http2;
    server_name r692-smoketest.local;  # unique name so default.conf still handles main app

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # R6.95: smoke test endpoint (exact match)
    # Fixed: $HOSTNAME (shell env, undefined) -> $hostname (nginx runtime var)
    location = /r692-smoketest-status {
        default_type text/plain;
        return 200 "r692-smoketest OK hostname=$hostname port=443\n";
    }
}
