         Reduces ~150-300ms DNS+TLS handshake on first HiPS tile fetch.

         Adding direct ESA archive preconnect for future Gaia cross-match features.

    <!-- R6.36: client-side HTTP -> HTTPS redirect.
         Lab VPN blocks fonts.googleapis.com for HTTP pages (caused R6.35b).
         This redirect forces users to HTTPS 6002 which isn't filtered.
         If user is already on HTTPS or localhost, no redirect. -->
    <script>
      (function() {
        try {
          var u = new URL(window.location.href);
          // Only redirect if: 1) HTTP, 2) port 6001, 3) not localhost
          if (u.protocol === 'http:' && u.port === '6001' &&
              !/^(localhost|127\.0\.0\.1)$/.test(u.hostname)) {
            u.protocol = 'https:';
            u.port = '6002';
            window.location.replace(u.toString());
          }
        } catch (e) { /* ignore */ }
      })();
    </script>

    <style>
      /* R6.40: per-unicode-range font loading. Browser only downloads the
         range it needs (most UI only needs Latin, no CJK until text appears).
         Fallback chain: per-range woff2 -> full woff2 -> local() -> system. */
      /* Inter Variable - Latin (most common) */
      @font-face {
        font-family: 'Inter'; font-style: normal; font-weight: 100 900;
        src: url('/fonts/inter-latin.woff2') format('woff2-variations'),
             url('/fonts/inter-latin.woff2') format('woff2');
        unicode-range: U+0020-007F, U+00A0-00FF;
        font-display: swap;
      }
      /* Inter - CJK (only loaded when Chinese chars render) */
      @font-face {
        font-family: 'Inter'; font-style: normal; font-weight: 100 900;
        src: url('/fonts/inter-cjk.woff2') format('woff2-variations'),
             url('/fonts/inter-cjk.woff2') format('woff2');
        unicode-range: U+4E00-9FFF, U+3000-303F, U+FE30-FEFF, U+FF00-FFEF;
        font-display: swap;
      }
      /* Inter - Other (symbols, fallback) */
      @font-face {
        font-family: 'Inter'; font-style: normal; font-weight: 100 900;
        src: url('/fonts/inter-other.woff2') format('woff2-variations'),

        unicode-range: U+0080-009F, U+0100-017F, U+0180-024F, U+0250-02AF, U+02B0-02FF, U+0300-036F, U+0370-03FF, U+0400-04FF, U+2000-209F, U+20A0-20CF, U+2100-214F, U+2150-218F, U+2190-21FF, U+2200-22FF, U+2300-23FF, U+2500-257F, U+2580-259F, U+25A0-25FF, U+2600-26FF, U+2700-27BF, U+2900-297F, U+2A00-2AFF, U+3000-303F, U+FE30-FEFF, U+FF00-FFEF;
        font-display: swap;
      }
      /* R6.41: per-page font weight subset. Only 400 (regular) + 700 (bold) needed for UI. */
/* Inter - Latin 400/700 weights only */
@font-face {
  font-family: 'Inter'; font-style: normal; font-weight: 400 700;
  src: url('/fonts/inter-weights.woff2') format('woff2-variations'),

}
/* Inter - system fallback (no unicode-range = always matches) */
      @font-face {

    <!-- R6.40: prod font fallback. If woff2 fails to load (network, CDN), use system font. -->
    <script>
      (function() {
        if (document.fonts && document.fonts.ready) {
          var timeoutId = setTimeout(function() {
            document.documentElement.classList.add('gw-font-fallback');
          }, 3000);
          document.fonts.ready.then(function() {
            clearTimeout(timeoutId);
            if (!document.fonts.check('1em Inter')) {
              document.documentElement.classList.add('gw-font-fallback');
              console.warn('[GW] woff2 font failed, using system font fallback');
            }
          });
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
