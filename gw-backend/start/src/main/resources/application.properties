# application settings
spring.application.name=gravitationalwave
spring.profiles.active=${profiles.active}

# WEB settings
server.port=8093
server.servlet.context-path=/

imagecutout.username=${IMAGECUTOUT_USERNAME:zhijiang}
imagecutout.password=${IMAGECUTOUT_PASSWORD}

# JWT authentication — secret must be provided via environment variable in production
jwt.secret=${JWT_SECRET:gw-platform-jwt-secret-key-2026-v4.7}
jwt.expiration=86400000
# Token refresh window: tokens within 30 min of expiry can be silently refreshed
jwt.refresh-window=1800000

# ── v4.16: Rate limiting — IP-based token bucket (Bucket4j) ──
#   capacity: max requests per client IP per refill window
#   refill-minutes: window duration in minutes
#   cleanup-minutes: interval for purging idle client buckets
#   login-capacity: stricter limit for /api/auth/login (anti-brute-force)
rate.limit.capacity=120
rate.limit.refill-minutes=1
rate.limit.cleanup-minutes=15
rate.limit.login-capacity=5
rate.limit.login-refill-minutes=15

# ── v4.16: Redis rate limiter (optional, enabled via spring.profiles.active=redis) ──
# When Redis is available, Bucket4j auto-switches to distributed mode.
# Without Redis (default), InMemoryRateLimiter is used (single-instance only).
# To enable: add bucket4j-redis + lettuce-core to pom.xml, set spring.profiles.active=redis

# ── v4.16: Elasticsearch index names (centralized, override per environment) ──
es.index.grawave=alicptabnormal
es.index.errordetail=errordetail
es.index.errorlist=errorlist

logging.level.org.springframework.context.annotation.ClassPathBeanDefinitionScanner=INFO
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=INFO
logging.level.org.springframework.web.filter=INFO
# DeepSeek LLM API — override in profile-specific config
deepseek.api.key=${DEEPSEEK_API_KEY:}
deepseek.api.url=https://api.deepseek.com/v1/chat/completions
deepseek.api.model=deepseek-chat
# LLM cost control (v4.12)
deepseek.api.daily-quota=500
deepseek.api.cache-ttl-minutes=30
