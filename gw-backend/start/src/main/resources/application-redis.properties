# ── v4.16 / R6.53 #3: Redis profile for distributed rate limiting ──
# Activated by including "redis" in SPRING_PROFILES_ACTIVE.
# Provides rate.limit.redis-uri and tunes capacities for prod.

# Distributed bucket storage URI (Bucket4j Lettuce proxy).
# Override per environment: docker-compose env, k8s ConfigMap, or .env.
rate.limit.redis-uri=${RATE_LIMIT_REDIS_URI:redis://localhost:6379}

# Slightly stricter limits under Redis (horizontal scaling now safe).
rate.limit.capacity=200
rate.limit.refill-minutes=1
rate.limit.login-capacity=10
rate.limit.login-refill-minutes=15

# Spring Data Redis (auto-configured via spring-boot-starter-data-redis)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# R6.73 #4: Redis ACL user (Spring Data Redis 2.6+ supports ACL).
# On zjlab the ACL file creates 3 users (admin/app/readonly).
# `app` is the default workload user (readwrite, -dangerous).
# Empty default keeps dev mode working (Redis without --aclfile uses
# default user, which is equivalent to single-user mode).
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}

# R6.73 #4: Multi-user observability connection (readonly).
# Optional: observability dashboards connect with `readonly` user (read-only).
# Override via env: OBSERVABILITY_REDIS_URI=redis://readonly:${REDIS_READONLY_PASSWORD}@redis:6379
observability.redis.uri=${OBSERVABILITY_REDIS_URI:}
spring.data.redis.timeout=2s
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2

# ── Health: actuator exposes redis indicator if needed ──
management.health.redis.enabled=true

logging.level.io.lettuce.core=INFO
logging.level.com.bucket4j=INFO
