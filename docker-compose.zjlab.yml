# ═══════════════════════════════════════════════════════════════════════════
# GravitationalWave — 之江实验室 ops-astronomy-03 生产覆盖配置 (v4.31)
# 用法: docker compose -f docker-compose.yml -f docker-compose.zjlab.yml up -d
#
# Pre-flight 确认 (2026-07-29):
#   - nvidia-container-toolkit 1.13.4 ✅
#   - Docker Default Runtime: nvidia ✅
#   - 2× Tesla V100 32GB (空闲) ✅
#   - 206GB 可用磁盘 ✅
#   - 端口 6001/6002 无冲突 ✅
# ═══════════════════════════════════════════════════════════════════════════

services:
  # ── 数据层：仅 gw-db 网段，禁止外部端口暴露 ──
  mongodb:
    ports: []  # 清除 docker-compose.yml 中的 27017 映射
    environment:
      SKIP_SEED_DATA: "true"  # 生产模式：不插入演示种子数据
    deploy:
      resources:
        limits: { cpus: '4.0', memory: 4G }
        reservations: { cpus: '1.0', memory: 1G }

  elasticsearch:
    ports: []  # 清除 9200 映射
    deploy:
      resources:
        limits: { cpus: '4.0', memory: 4G }
        reservations: { cpus: '1.0', memory: 1G }

  # ── R6.71 #3: Redis with optional AUTH (defense-in-depth) ──
  # Inherits base image + volumes + healthcheck from docker-compose.yml.
  # Overrides command to add --requirepass if REDIS_PASSWORD env is set.
  # On zjlab: set REDIS_PASSWORD in /home/zjlab/gravitationalwave-v4.31/.env
  # (generate with: openssl rand -base64 32).
  redis:
    # R6.73 #4: enable ACL with 3 users (admin/app/readonly). Falls back
    # to REDIS_PASSWORD (single user) if ACL file not yet provisioned.
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      # R6.73 #4: ACL file with 3 users. To enable:
      #   1. Generate 3 passwords (openssl rand -base64 32 each)
      #   2. cp D:/AliCPT/docs/redis/redis.acl.template redis.acl
      #   3. Fill in ${REDIS_ADMIN_PASSWORD}, ${REDIS_APP_PASSWORD}, ${REDIS_READONLY_PASSWORD}
      #   4. Uncomment --aclfile line + add redis.acl volume mount
      # Currently disabled by default (single-password mode from R6.71 #3 still works).
      # - --aclfile
      # - /usr/local/etc/redis/redis.acl
      # R6.71 #3 single-password fallback:
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env on zjlab}

  # ── 应用层：仅 gw-net 内部通信，由 gw-frontend nginx 反代 ──
  gw-firefly:
    ports: []  # 清除 8080 映射 → nginx 反代 /firefly/

  gw-backend:
    ports: []  # 清除 8093 映射 → nginx 反代 /api/
    environment:
      SPRING_PROFILES_ACTIVE: local
      rate.limit.capacity: 30
      rate.limit.refill-minutes: 1
      JAVA_OPTS: "-Xms1g -Xmx3g"
      # R6.71 #3: pass Redis password for Spring Data Redis + Bucket4j Lettuce
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env on zjlab}
      # R6.73 #4: Redis ACL username (default: app user, empty string = single-user mode)
      REDIS_USERNAME: ${REDIS_USERNAME:-}
      # R6.73 #4: Bucket4j URI now includes username (defaults to empty for backward compat)
      RATE_LIMIT_REDIS_URI: redis://${REDIS_USERNAME:-}:${REDIS_PASSWORD}@redis:6379
      # R6.73 #4: Optional observability connection (readonly user, empty default = feature off)
      OBSERVABILITY_REDIS_URI: ${OBSERVABILITY_REDIS_URI:-}
    deploy:
      resources:
        limits: { cpus: '4.0', memory: 4G }
        reservations: { cpus: '1.0', memory: 1G }

  gw-pipeline:
    ports: []  # 清除 8200 映射 → nginx 反代 /pipeline/
    # v4.31: GPU 加速 — nvidia 已是 Docker 默认运行时
    # Phase 1: onnxruntime 1.20.1 (CPU) — GPU 设备可见但未使用
    # Phase 2: 升级 onnxruntime-gpu + nvidia/cuda 基础镜像 → GPU 推理
    deploy:
      resources:
        limits: { cpus: '8.0', memory: 8G }
        reservations: { cpus: '2.0', memory: 2G }
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]
    environment:
      GW_EXCLUDE_GPL_MODELS: "false"  # 内部科研使用，保留 GPL 模型

  gw-mcp-server:
    ports: []  # 清除 8100 映射

  # ── 前端层：唯一对外暴露的端口 ──
  gw-frontend:
    build:
      args:
        APP_RUN_ENV: prod  # 覆盖 dev → 生产构建 (tsc -b && vite build)
    ports:
      - "6001:80"
      - "6002:443"
